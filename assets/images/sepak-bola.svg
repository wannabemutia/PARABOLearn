<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="grassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16A34A"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" rx="12" fill="url(#skyGrad)"/>
  <!-- Field -->
  <rect y="210" width="400" height="50" fill="url(#grassGrad)"/>
  <line x1="0" y1="210" x2="400" y2="210" stroke="#BBF7D0" stroke-width="3"/>
  
  <!-- Goal Net -->
  <path d="M 320 210 L 320 120 L 370 140 L 370 210 Z" fill="none" stroke="#FFFFFF" stroke-width="3"/>
  <path d="M 320 120 L 370 140" stroke="#E2E8F0" stroke-width="1.5"/>
  <path d="M 325 210 L 325 125 M 335 210 L 335 129 M 345 210 L 345 133 M 355 210 L 355 137 M 365 210 L 365 141" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="2 2"/>
  <path d="M 320 140 L 370 155 M 320 160 L 370 173 M 320 180 L 370 190" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- Parabolic Arc of Ball -->
  <path d="M 60 205 Q 190 40 330 150" fill="none" stroke="#2563EB" stroke-width="3.5" stroke-dasharray="6 4"/>

  <!-- Football Player Silhouette / Minimalist figure -->
  <g transform="translate(30, 130)">
    <!-- Head -->
    <circle cx="20" cy="15" r="10" fill="#1E3A8A"/>
    <!-- Body -->
    <path d="M 20 25 L 26 50 L 14 58 L 22 75" stroke="#1E3A8A" stroke-width="5" stroke-linecap="round" fill="none"/>
    <!-- Kicking Leg -->
    <path d="M 26 50 L 40 65 L 52 68" stroke="#2563EB" stroke-width="5" stroke-linecap="round" fill="none"/>
    <!-- Arms -->
    <path d="M 8 36 L 20 30 L 32 38" stroke="#1E3A8A" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Soccer Ball in Flight -->
  <g transform="translate(190, 75)">
    <circle cx="0" cy="0" r="10" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
    <polygon points="0,-4 4,-1 2,4 -2,4 -4,-1" fill="#0F172A"/>
  </g>
  
  <!-- Ball at Target -->
  <circle cx="330" cy="150" r="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5" opacity="0.7"/>

  <!-- Motion vectors -->
  <line x1="60" y1="205" x2="100" y2="155" stroke="#F59E0B" stroke-width="2.5"/>
  <polygon points="100,155 92,160 97,167" fill="#F59E0B"/>
  <text x="105" y="160" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#D97706">v₀</text>

  <!-- Description label -->
  <rect x="15" y="15" width="220" height="26" rx="6" fill="#FFFFFF" opacity="0.9" stroke="#E2E8F0"/>
  <text x="25" y="32" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#1E3A8A">1. Tendangan Bebas Sepak Bola</text>
</svg>

