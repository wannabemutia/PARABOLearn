<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <defs>
    <linearGradient id="gymGrad" x1="0%" y1="0%" x2="0%" y2="1">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="0%" y2="1">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" rx="12" fill="url(#gymGrad)"/>
  <!-- Court floor -->
  <rect y="215" width="400" height="45" fill="url(#woodGrad)"/>
  <line x1="0" y1="215" x2="400" y2="215" stroke="#FFFFFF" stroke-width="2.5"/>

  <!-- Basketball Hoop / Backboard -->
  <rect x="360" y="70" width="8" height="60" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5"/>
  <line x1="368" y1="90" x2="395" y2="90" stroke="#475569" stroke-width="4"/>
  <line x1="395" y1="90" x2="395" y2="215" stroke="#334155" stroke-width="5"/>
  <!-- Rim -->
  <line x1="335" y1="105" x2="360" y2="105" stroke="#EA580C" stroke-width="3.5"/>
  <!-- Net -->
  <path d="M 336 105 L 342 135 L 354 135 L 360 105" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
  <path d="M 342 105 L 348 135 L 354 105" stroke="#FFFFFF" stroke-width="1.5"/>

  <!-- Shooter Figure -->
  <g transform="translate(60, 100)">
    <circle cx="15" cy="15" r="9" fill="#1E3A8A"/>
    <!-- Body -->
    <line x1="15" y1="24" x2="15" y2="65" stroke="#1E3A8A" stroke-width="4.5"/>
    <!-- Legs -->
    <path d="M 15 65 L 10 115 M 15 65 L 22 115" stroke="#1E3A8A" stroke-width="4" stroke-linecap="round"/>
    <!-- Arms raised releasing ball -->
    <path d="M 15 32 L 28 20 L 38 12" stroke="#2563EB" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 15 32 L 22 24 L 32 16" stroke="#2563EB" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Parabolic Arc of Basketball -->
  <path d="M 100 110 Q 220 20 345 105" fill="none" stroke="#EA580C" stroke-width="3" stroke-dasharray="6 4"/>

  <!-- Basketball at Peak -->
  <g transform="translate(220, 48)">
    <circle cx="0" cy="0" r="11" fill="#EA580C" stroke="#7C2D12" stroke-width="1.5"/>
    <line x1="-11" y1="0" x2="11" y2="0" stroke="#7C2D12" stroke-width="1.5"/>
    <line x1="0" y1="-11" x2="0" y2="11" stroke="#7C2D12" stroke-width="1.5"/>
  </g>

  <!-- Angle arc & vector -->
  <line x1="100" y1="110" x2="135" y2="70" stroke="#2563EB" stroke-width="2.5"/>
  <polygon points="135,70 126,73 131,80" fill="#2563EB"/>
  <text x="140" y="75" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#1D4ED8">v₀ (sudut tinggi)</text>

  <!-- Title Badge -->
  <rect x="15" y="15" width="220" height="26" rx="6" fill="#FFFFFF" opacity="0.9" stroke="#E2E8F0"/>
  <text x="25" y="32" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#1E3A8A">2. Lemparan Bola Basket</text>
</svg>

