<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="1">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" rx="12" fill="url(#skyGrad)"/>
  <!-- Ground -->
  <rect y="215" width="400" height="45" fill="#64748B"/>
  <line x1="0" y1="215" x2="400" y2="215" stroke="#94A3B8" stroke-width="2"/>

  <!-- Hose and Nozzle -->
  <path d="M 0 215 Q 40 215 50 180 L 65 160" fill="none" stroke="#DC2626" stroke-width="9" stroke-linecap="round"/>
  <!-- Nozzle Brass -->
  <line x1="63" y1="162" x2="75" y2="148" stroke="#F59E0B" stroke-width="10" stroke-linecap="round"/>

  <!-- Water Jet Parabolic Streams -->
  <path d="M 75 148 Q 200 15 340 215" fill="none" stroke="url(#waterGrad)" stroke-width="7" stroke-linecap="round" opacity="0.85"/>
  <path d="M 75 148 Q 205 30 350 215" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  <path d="M 75 148 Q 195 5 330 215" fill="none" stroke="#0284C7" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

  <!-- Water Droplets / Splashes at target -->
  <circle cx="340" cy="215" r="4" fill="#38BDF8"/>
  <circle cx="348" cy="210" r="3" fill="#38BDF8"/>
  <circle cx="355" cy="213" r="3.5" fill="#38BDF8"/>
  <circle cx="332" cy="212" r="2.5" fill="#38BDF8"/>
  
  <!-- Droplets in arc -->
  <circle cx="160" cy="85" r="3" fill="#38BDF8" opacity="0.7"/>
  <circle cx="240" cy="95" r="3.5" fill="#38BDF8" opacity="0.7"/>
  <circle cx="290" cy="145" r="3" fill="#38BDF8" opacity="0.7"/>

  <!-- Elevation angle -->
  <line x1="75" y1="148" x2="115" y2="105" stroke="#2563EB" stroke-width="2" stroke-dasharray="3 3"/>
  <line x1="75" y1="148" x2="120" y2="148" stroke="#64748B" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="120" y="140" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#2563EB">θ elevasi</text>

  <!-- Title Badge -->
  <rect x="15" y="15" width="220" height="26" rx="6" fill="#FFFFFF" opacity="0.9" stroke="#E2E8F0"/>
  <text x="25" y="32" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#1E3A8A">3. Semburan Air dari Selang</text>
</svg>

